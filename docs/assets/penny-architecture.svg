<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">PENNY architecture and Cloudflare request flow</title>
<desc id="desc">User messages pass through Angular and NestJS local parsing. Eligible unresolved requests use Cloudflare with PENNY guidance and current draft context. Application validation returns drafts or clarification. Personal expenses are saved only after user confirmation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif} .heading{font-size:17px;font-weight:700;fill:#334155}.label{font-size:16px;font-weight:700;fill:white}.small{font-size:13px;fill:#475569}.sub{font-size:13px;fill:white}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}
</style>
</defs>
<rect width="1400" height="880" rx="20" fill="#f8fafc"/>
<text x="44" y="48" font-size="28" font-weight="700" fill="#0f172a">PENNY · Message to reviewable draft</text>
<text x="44" y="76" class="small">XPENSE architecture • local parsing first • Cloudflare interpretation when eligible • application validation</text>
<rect x="34" y="112" width="245" height="560" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="54" y="144" class="heading">Conversation layer</text>
<rect x="55" y="190" width="202" height="80" rx="12" fill="#7c3aed"/>
<text x="156" y="224" text-anchor="middle" class="label">User message</text><text x="156" y="247" text-anchor="middle" class="sub">New input or follow-up</text>
<rect x="55" y="320" width="202" height="100" rx="12" fill="#2563eb"/>
<text x="156" y="351" text-anchor="middle" class="label">Angular chat</text><text x="156" y="377" text-anchor="middle" class="sub">Current drafts + timestamp</text><text x="156" y="399" text-anchor="middle" class="sub">Conversation ID + request ID</text>
<rect x="55" y="500" width="202" height="95" rx="12" fill="#2563eb"/>
<text x="156" y="532" text-anchor="middle" class="label">Session storage</text><text x="156" y="557" text-anchor="middle" class="sub">User-scoped draft snapshot</text><text x="156" y="578" text-anchor="middle" class="sub">5-minute recovery window</text>
<path d="M156 270V320" class="line"/><path d="M156 420V500" class="line dash"/>
<rect x="305" y="112" width="435" height="560" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
<text x="325" y="144" class="heading">NestJS application layer</text>
<rect x="330" y="180" width="385" height="85" rx="12" fill="#ea580c"/>
<text x="522" y="214" text-anchor="middle" class="label">ParserController + authentication</text><text x="522" y="240" text-anchor="middle" class="sub">Validate request • route personal / split / follow-up</text>
<rect x="330" y="320" width="385" height="100" rx="12" fill="#16a34a"/>
<text x="522" y="353" text-anchor="middle" class="label">Local parsing + service orchestration</text><text x="522" y="379" text-anchor="middle" class="sub">IntentService • SplitIntentService</text><text x="522" y="402" text-anchor="middle" class="sub">PersonalFollowUpService • SplitFollowUpService</text>
<rect x="330" y="510" width="385" height="100" rx="12" fill="#0f766e"/>
<text x="522" y="543" text-anchor="middle" class="label">Validate proposed facts</text><text x="522" y="569" text-anchor="middle" class="sub">Check amounts, names, targets and JSON fields</text><text x="522" y="592" text-anchor="middle" class="sub">Accept draft edits or ask for clarification</text>
<path d="M257 350H294V223H330" class="line"/><path d="M522 265V320" class="line"/>
<path d="M460 420V510" class="line"/><text x="346" y="462" class="small">Local result</text>
<rect x="770" y="112" width="596" height="560" rx="16" fill="#f0f9ff" stroke="#bae6fd"/>
<text x="792" y="144" class="heading">PENNY interpretation layer</text>
<rect x="794" y="180" width="260" height="85" rx="12" fill="#b45309"/>
<text x="924" y="214" text-anchor="middle" class="label">docs/AGENTS.md</text><text x="924" y="240" text-anchor="middle" class="sub">Marked PENNY runtime guidance</text>
<rect x="1074" y="180" width="268" height="85" rx="12" fill="#b45309"/>
<text x="1208" y="214" text-anchor="middle" class="label">backend/.env</text><text x="1208" y="240" text-anchor="middle" class="sub">Account • API token • model</text>
<rect x="794" y="320" width="548" height="100" rx="12" fill="#ea580c"/>
<text x="1068" y="351" text-anchor="middle" class="label">Cloudflare adapters</text><text x="1068" y="377" text-anchor="middle" class="sub">Guidance + task instructions + message / draft context</text><text x="1068" y="401" text-anchor="middle" class="sub">JSON schema • HTTPS POST • 20-second timeout</text>
<rect x="870" y="510" width="396" height="100" rx="12" fill="#4f46e5"/>
<text x="1068" y="544" text-anchor="middle" class="label">Cloudflare Workers AI</text><text x="1068" y="570" text-anchor="middle" class="sub">Configured model acts as PENNY</text><text x="1068" y="593" text-anchor="middle" class="sub">Returns a JSON proposal</text>
<path d="M924 265V320" class="line dash"/><path d="M1208 265V320" class="line dash"/>
<path d="M715 370H794" class="line"/><text x="728" y="303" class="small">Eligible</text><text x="728" y="319" class="small">fallback</text>
<path d="M1068 420V510" class="line"/><path d="M870 560H715" class="line"/><text x="753" y="548" class="small">Proposal</text>
<rect x="330" y="710" width="385" height="70" rx="12" fill="#2563eb"/>
<text x="522" y="740" text-anchor="middle" class="label">Reviewable cards / clarification</text><text x="522" y="763" text-anchor="middle" class="sub">Frontend applies validated draft updates</text>
<rect x="870" y="710" width="396" height="70" rx="12" fill="#9333ea"/>
<text x="1068" y="740" text-anchor="middle" class="label">Confirmed personal expenses</text><text x="1068" y="763" text-anchor="middle" class="sub">Expense API → Supabase</text>
<path d="M522 610V710" class="line"/><path d="M715 745H870" class="line"/><text x="741" y="730" class="small">User confirms</text>
<text x="44" y="827" class="heading">Legend</text>
<rect x="135" y="813" width="17" height="17" rx="4" fill="#2563eb"/><text x="160" y="827" class="small">UI / state</text>
<rect x="265" y="813" width="17" height="17" rx="4" fill="#ea580c"/><text x="290" y="827" class="small">Backend / adapters</text>
<rect x="450" y="813" width="17" height="17" rx="4" fill="#16a34a"/><text x="475" y="827" class="small">Local parsing</text>
<rect x="600" y="813" width="17" height="17" rx="4" fill="#b45309"/><text x="625" y="827" class="small">Configuration</text>
<rect x="755" y="813" width="17" height="17" rx="4" fill="#4f46e5"/><text x="780" y="827" class="small">AI provider</text>
<rect x="895" y="813" width="17" height="17" rx="4" fill="#0f766e"/><text x="920" y="827" class="small">Validation</text>
<path d="M1050 822H1100" class="line dash"/><text x="1113" y="827" class="small">Configuration / state flow</text>
<text x="44" y="858" class="small">Solid arrows: request, proposal, or result flow. Follow-up context is supplied per request; PENNY does not retain conversation memory.</text>
</svg>
