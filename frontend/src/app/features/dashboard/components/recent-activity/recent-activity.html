<section class="flex h-full min-w-0 flex-col rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900" aria-labelledby="recent-activity-title">
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-zinc-500 dark:text-zinc-400">Activity</p>
      <h2 id="recent-activity-title" class="mt-1.5 text-lg font-semibold text-zinc-950 dark:text-white">Recent transactions</h2>
    </div>
    <a routerLink="/history" class="min-h-11 rounded-full px-3 py-2 text-xs font-semibold text-emerald-700 transition-colors hover:bg-emerald-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 dark:text-emerald-400 dark:hover:bg-emerald-950/50" aria-label="View all transactions">View all</a>
  </div>

  <div class="mt-5 flex flex-col gap-1">
    @for (item of transactions; track item.merchant) {
      <a routerLink="/history" class="group flex min-h-14 items-center justify-between gap-3 rounded-2xl px-2 py-2.5 transition-colors hover:bg-zinc-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 dark:hover:bg-zinc-950/70">
        <div class="flex min-w-0 items-center gap-3">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-300">
            <app-category-icon [category]="item.category" />
          </span>
          <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-zinc-900 dark:text-white">{{ item.merchant }}</p>
            <p class="mt-0.5 truncate text-xs text-zinc-500 dark:text-zinc-400">{{ item.category }} · {{ item.date }}</p>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-2 text-right">
          <p class="text-sm font-semibold" [class.text-blue-600]="item.type === 'credit'" [class.text-red-600]="item.type !== 'credit'" [class.dark:text-blue-400]="item.type === 'credit'" [class.dark:text-red-400]="item.type !== 'credit'">{{ item.type === 'credit' ? '+' : '-' }}₹{{ item.amount | number }}</p>
          <svg viewBox="0 0 24 24" class="h-4 w-4 text-zinc-300 transition-transform group-hover:translate-x-0.5 dark:text-zinc-600" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </div>
      </a>
    }
  </div>
</section>
