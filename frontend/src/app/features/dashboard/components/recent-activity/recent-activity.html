<div class="flex h-full flex-col rounded-[1.25rem] border border-zinc-200 bg-white p-3.5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-4">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold text-zinc-900 dark:text-white">Recent Activity</h2>
      <p class="mt-0.5 text-sm text-zinc-500 dark:text-zinc-400">Latest transactions</p>
    </div>
    <button class="rounded-full bg-zinc-100 px-2.5 py-1 text-sm font-medium text-zinc-700 transition hover:bg-zinc-200 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700">
      View all
    </button>
  </div>

  <div class="mt-3 flex flex-col gap-2">
    <div *ngFor="let item of transactions" class="flex min-h-[3.25rem] items-center justify-between gap-3 rounded-[0.95rem] bg-zinc-50 px-3 py-2.5 transition hover:bg-zinc-100 dark:bg-zinc-950/70 dark:hover:bg-zinc-800/70">
      <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-zinc-200 text-sm dark:bg-zinc-800">
          {{ item.icon }}
        </div>
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-zinc-900 dark:text-white">{{ item.merchant }}</p>
          <p class="mt-0.5 text-xs text-zinc-500 dark:text-zinc-400">{{ item.date }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-right">
        <div class="min-w-0">
          <p class="text-sm font-semibold text-zinc-900 dark:text-white">{{ item.type === 'credit' ? '+' : '-' }}₹{{ item.amount | number }}</p>
          <p class="mt-0.5 text-xs text-zinc-500 dark:text-zinc-400">{{ item.category }}</p>
        </div>
        <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 text-zinc-400" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </div>
    </div>
  </div>
</div>
