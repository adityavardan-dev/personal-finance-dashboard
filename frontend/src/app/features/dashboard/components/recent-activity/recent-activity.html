<div class="rounded-3xl bg-white dark:bg-zinc-900 p-6 shadow-sm space-y-4 flex h-full flex-col">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-semibold text-zinc-900 dark:text-white">Recent Activity</h2>
      <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Latest transactions from your account</p>
    </div>
    <button class="rounded-full bg-zinc-100 px-4 py-2 text-sm text-zinc-700 transition hover:bg-zinc-200 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700">
      View all
    </button>
  </div>

  <div class="space-y-3">
    <div *ngFor="let item of transactions" class="flex items-center justify-between gap-4 rounded-3xl bg-zinc-50 p-4 transition hover:bg-zinc-100 dark:bg-zinc-950 dark:hover:bg-zinc-900">
      <div class="flex items-center gap-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-3xl bg-zinc-200 text-lg dark:bg-zinc-800">
          {{ item.icon }}
        </div>
        <div>
          <p class="font-semibold text-zinc-900 dark:text-white">{{ item.merchant }}</p>
          <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">{{ item.category }}</p>
        </div>
      </div>
      <div class="text-right">
        <p class="font-semibold text-zinc-900 dark:text-white">{{ item.type === 'credit' ? '+' : '-' }}₹{{ item.amount | number }}</p>
        <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">{{ item.date }}</p>
      </div>
    </div>
  </div>
</div>
