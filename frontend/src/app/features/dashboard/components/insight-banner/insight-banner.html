<section class="rounded-3xl border p-6 shadow-sm" [class.border-emerald-200]="severity === 'positive'" [class.bg-emerald-50]="severity === 'positive'" [class.dark:border-emerald-900]="severity === 'positive'" [class.dark:bg-emerald-950]="severity === 'positive'" [class.border-amber-300]="severity === 'warning'" [class.bg-amber-50]="severity === 'warning'" [class.dark:border-amber-800]="severity === 'warning'" [class.dark:bg-amber-950]="severity === 'warning'" [class.border-red-300]="severity === 'critical'" [class.bg-red-50]="severity === 'critical'" [class.dark:border-red-900]="severity === 'critical'" [class.dark:bg-red-950]="severity === 'critical'" [class.border-zinc-200]="severity === 'info'" [class.bg-white]="severity === 'info'" [class.dark:border-zinc-800]="severity === 'info'" [class.dark:bg-zinc-900]="severity === 'info'" aria-labelledby="insight-title" [attr.role]="severity === 'warning' || severity === 'critical' ? 'alert' : 'status'">
  <div class="flex items-start gap-4"><div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-white text-emerald-600 shadow-sm dark:bg-zinc-900 dark:text-emerald-400" aria-hidden="true">{{ severity === 'critical' ? '!' : '%' }}</div><div class="min-w-0 pt-0.5"><p class="text-xs font-semibold uppercase tracking-[0.16em] text-zinc-500 dark:text-zinc-400">XPENSE Intelligence</p><h2 id="insight-title" class="mt-1.5 text-base font-semibold leading-6 text-zinc-950 dark:text-white sm:text-lg">{{ title }}</h2><p class="mt-1.5 text-sm leading-6 text-zinc-600 dark:text-zinc-300">{{ message }}</p></div></div>
</section>
