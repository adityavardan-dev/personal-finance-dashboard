<div class="relative overflow-hidden rounded-[1.5rem] bg-gradient-to-br from-emerald-950 via-emerald-900 to-emerald-800 p-4 text-white shadow-[0_20px_44px_-20px_rgba(0,0,0,0.55)] sm:p-5">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(255,255,255,0.2),_transparent_48%)]" aria-hidden="true"></div>
  <div class="absolute inset-0 bg-[linear-gradient(135deg,rgba(255,255,255,0.10),transparent_40%,rgba(255,255,255,0.04))]" aria-hidden="true"></div>

  <div class="relative flex flex-col gap-3.5">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="text-[0.65rem] font-semibold uppercase tracking-[0.28em] text-emerald-100/80">Current Month</p>
        <h2 class="mt-1.5 text-[1.55rem] font-semibold leading-tight text-white">₹{{ spent | number }}</h2>
        <p class="mt-1 text-sm text-emerald-100/80">Amount Spent</p>
      </div>

      <div class="relative flex h-[4.35rem] w-[4.35rem] shrink-0 items-center justify-center">
        <svg class="h-[4.35rem] w-[4.35rem] -rotate-90" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="38" stroke="rgba(255,255,255,0.12)" stroke-width="4.5" fill="none" />
          <circle
            cx="50"
            cy="50"
            r="38"
            stroke="rgba(255,255,255,0.75)"
            stroke-width="4.5"
            fill="none"
            stroke-linecap="round"
            [attr.stroke-dasharray]="circumference"
            [attr.stroke-dashoffset]="progressOffset"
          />
        </svg>
        <div class="absolute text-center">
          <p class="text-base font-semibold text-white">{{ percentage | number:'1.0-0' }}%</p>
        </div>
      </div>
    </div>

    <div class="rounded-[1.1rem] border border-white/10 bg-white/10 p-3.5 backdrop-blur-sm">
      <div class="flex items-center justify-between text-sm">
        <span class="text-emerald-50/80">Budget</span>
        <span class="font-semibold text-white">₹{{ budget | number }}</span>
      </div>

      <div class="mt-3 h-2 overflow-hidden rounded-full bg-white/20">
        <div class="h-full rounded-full bg-emerald-300 transition-all duration-300" [style.width.%]="percentage"></div>
      </div>

      <div class="mt-3 flex items-end justify-between gap-3">
        <div>
          <p class="text-[0.62rem] uppercase tracking-[0.24em] text-emerald-100/70">Remaining</p>
          <p class="mt-1 text-sm font-semibold text-white">₹{{ budget - spent | number }}</p>
        </div>
        <div class="text-right">
          <p class="text-[0.62rem] uppercase tracking-[0.24em] text-emerald-100/70">Days</p>
          <p class="mt-1 text-sm font-semibold text-white">{{ daysLeft }} left</p>
        </div>
      </div>
    </div>
  </div>
</div>
