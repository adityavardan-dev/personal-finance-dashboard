<section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-950 via-emerald-900 to-emerald-800 p-5 text-white shadow-sm sm:p-6 lg:min-h-[220px] lg:p-7" aria-labelledby="hero-title">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(255,255,255,0.16),_transparent_48%)]" aria-hidden="true"></div>
  <div class="relative grid gap-5 sm:grid-cols-[1fr_auto] sm:items-center lg:gap-8">
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase tracking-[0.22em] text-emerald-100/75">Current month</p>
      <h2 id="hero-title" class="mt-2 text-4xl font-bold leading-none tracking-tight sm:text-5xl">₹{{ spent | number }}</h2>
      <p class="mt-2 text-sm text-emerald-100/80">Amount spent</p>

      <div class="mt-6 max-w-xl">
        <div class="flex items-center justify-between gap-3 text-sm">
          <span class="text-emerald-50/80">Budget</span>
          <span class="font-semibold text-white">₹{{ budget | number }}</span>
        </div>
        <div class="mt-2 h-2 overflow-hidden rounded-full bg-white/15" role="progressbar" [attr.aria-valuenow]="percentage" aria-valuemin="0" aria-valuemax="100" [attr.aria-label]="'Monthly budget: ' + (percentage | number:'1.0-0') + '% spent'">
          <div class="h-full rounded-full bg-emerald-300 transition-[width] duration-500" [style.width.%]="percentage"></div>
        </div>
        <div class="mt-3 flex items-end justify-between gap-4">
          <div>
            <p class="text-[0.65rem] font-medium uppercase tracking-[0.18em] text-emerald-100/60">Remaining</p>
            <p class="mt-1 text-base font-semibold">₹{{ budget - spent | number }}</p>
          </div>
          <p class="text-right text-sm text-emerald-100/75"><span class="font-semibold text-white">{{ daysLeft }}</span> days left</p>
        </div>
      </div>
    </div>

    <div class="mx-auto flex h-28 w-28 shrink-0 items-center justify-center sm:mx-0 sm:h-32 sm:w-32 lg:h-36 lg:w-36" aria-hidden="true">
      <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="39" stroke="rgba(255,255,255,0.12)" stroke-width="5" fill="none" />
        <circle cx="50" cy="50" r="39" stroke="rgba(255,255,255,0.8)" stroke-width="5" fill="none" stroke-linecap="round" [attr.stroke-dasharray]="circumference" [attr.stroke-dashoffset]="progressOffset" />
      </svg>
      <div class="absolute text-center">
        <p class="text-xl font-bold">{{ percentage | number:'1.0-0' }}%</p>
        <p class="mt-0.5 text-[0.65rem] uppercase tracking-[0.16em] text-emerald-100/70">used</p>
      </div>
    </div>
  </div>
</section>
