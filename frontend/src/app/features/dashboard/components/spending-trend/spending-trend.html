<section class="flex h-full min-w-0 flex-col rounded-3xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-6" aria-labelledby="spending-trend-title">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-zinc-500 dark:text-zinc-400">Spending trend</p>
      <h2 id="spending-trend-title" class="mt-1.5 text-lg font-semibold text-zinc-950 dark:text-white">Last 6 months</h2>
    </div>
    <div class="shrink-0 text-right">
      <p class="text-xs text-zinc-500 dark:text-zinc-400">Total</p>
      <p class="mt-0.5 text-sm font-semibold text-zinc-900 dark:text-white">₹{{ total | number }}</p>
    </div>
  </div>

  <div class="mt-6 flex min-h-[13rem] flex-1 flex-col" role="img" [attr.aria-label]="'Six month spending trend. Highest spending was ' + topMonth">
    <div class="flex flex-1 items-end gap-2 border-b border-zinc-200 px-1 pb-0 pt-3 dark:border-zinc-800 sm:gap-3">
      @for (value of values; track categories[$index]) {
        <div class="group flex h-full min-w-0 flex-1 flex-col justify-end">
          <div class="mb-2 text-center text-[0.65rem] font-medium text-zinc-500 opacity-0 transition-opacity group-hover:opacity-100 dark:text-zinc-400">₹{{ value | number }}</div>
          <div class="mx-auto w-full max-w-10 rounded-t-xl bg-emerald-500 transition-all duration-300 group-hover:bg-emerald-400 dark:bg-emerald-400 dark:group-hover:bg-emerald-300" [style.height.%]="(value / maxValue) * 100"></div>
        </div>
      }
    </div>
    <div class="grid grid-cols-6 gap-2 px-1 pt-2 text-center text-[0.7rem] font-medium text-zinc-500 dark:text-zinc-400 sm:gap-3">
      @for (month of categories; track month) {
        <span>{{ month }}</span>
      }
    </div>
  </div>

  <div class="mt-5 flex items-center justify-between gap-4 rounded-2xl bg-zinc-50 px-4 py-3 dark:bg-zinc-950/60">
    <div>
      <p class="text-xs text-zinc-500 dark:text-zinc-400">Average monthly spend</p>
      <p class="mt-0.5 text-sm font-semibold text-zinc-900 dark:text-white">₹{{ average | number }}</p>
    </div>
    <div class="text-right">
      <p class="text-xs text-zinc-500 dark:text-zinc-400">Highest month</p>
      <p class="mt-0.5 text-sm font-semibold text-zinc-900 dark:text-white">{{ topMonth }}</p>
    </div>
  </div>
</section>
