<div class="flex h-full flex-col rounded-[1.25rem] border border-zinc-200 bg-white p-3.5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-4">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-[0.65rem] font-semibold uppercase tracking-[0.28em] text-zinc-500 dark:text-zinc-400">Monthly Spending</p>
      <h2 class="mt-1.5 text-base font-semibold text-zinc-900 dark:text-white">Last 6 Months</h2>
    </div>
    <div class="rounded-full bg-zinc-100 px-2.5 py-1 text-[0.7rem] font-medium text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300">
      Total ₹{{ total | number }}
    </div>
  </div>

  <div class="mt-3 min-h-[9rem] rounded-[1rem] border border-dashed border-zinc-200 bg-zinc-50 p-3 dark:border-zinc-700 dark:bg-zinc-950/60">
    <div class="flex items-center justify-between">
      <p class="text-sm font-medium text-zinc-600 dark:text-zinc-300">Spending trend</p>
      <p class="text-xs text-zinc-500 dark:text-zinc-400">Chart placeholder</p>
    </div>
    <div class="mt-3 flex h-20 items-end gap-2">
      <div class="h-8 flex-1 rounded-t-full bg-emerald-300/80"></div>
      <div class="h-11 flex-1 rounded-t-full bg-emerald-400/80"></div>
      <div class="h-15 flex-1 rounded-t-full bg-emerald-500/80"></div>
      <div class="h-12 flex-1 rounded-t-full bg-emerald-400/80"></div>
      <div class="h-16 flex-1 rounded-t-full bg-emerald-600/80"></div>
      <div class="h-13 flex-1 rounded-t-full bg-emerald-500/80"></div>
    </div>
  </div>
</div>
