<app-app-layout>
  <div class="space-y-6">
    @if (metricsStore.status() === 'error') {
      <section class="rounded-3xl border border-red-200 bg-red-50 p-5 dark:border-red-900 dark:bg-red-950/30" role="alert"><p class="text-sm font-medium text-red-700 dark:text-red-300">{{ metricsStore.errorMessage() }}</p><button type="button" (click)="metricsStore.refresh()" class="mt-3 min-h-11 rounded-full px-4 text-sm font-semibold text-red-700 hover:bg-red-100">Retry</button></section>
    }
    <section class="min-w-0" aria-label="Monthly spending overview"><app-hero-card [spent]="totalSpent()" [budget]="budgetStore.monthlyLimit()" [currencySymbol]="currencySymbol()" (budgetSetupRequested)="scrollToBudget()" /></section>
    <app-budget-editor class="block" />
    <app-insight-banner class="block" [insight]="primaryInsight()" />
    <div class="grid min-w-0 gap-6 lg:grid-cols-[1.2fr_0.95fr] lg:items-stretch"><div class="min-w-0"><app-spending-trend [points]="trend()" /></div><div class="min-w-0"><app-recent-activity [transactions]="recentTransactions()" /></div></div>
  </div>
</app-app-layout>
