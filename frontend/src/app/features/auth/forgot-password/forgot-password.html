<main class="min-h-screen bg-zinc-50 px-5 py-8 text-zinc-950 dark:bg-zinc-950 dark:text-zinc-50 sm:flex sm:items-center sm:justify-center sm:px-6 lg:px-8">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center sm:mb-10">
      <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-500 text-xl font-bold text-white shadow-sm">X</div>
      <p class="text-sm font-semibold tracking-[0.2em] text-emerald-700 dark:text-emerald-400">XPENSE</p>
      <h1 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">Reset your password</h1>
      <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">Enter your email and we’ll help you get back into your account.</p>
    </div>

    <section class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-8" aria-labelledby="forgot-title">
      @if (submitted) {
        <div role="status" class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm leading-5 text-emerald-800 dark:border-emerald-900/60 dark:bg-emerald-950/30 dark:text-emerald-200">
          If an account exists for that email, reset instructions will be sent when password recovery is enabled.
        </div>
      } @else {
        <form (ngSubmit)="submit()" #forgotForm="ngForm" novalidate>
          <label for="email" class="mb-2 block text-sm font-medium">Email address</label>
          <input id="email" name="email" type="email" required email autocomplete="email" ngModel placeholder="you@example.com"
            class="min-h-12 w-full rounded-2xl border border-zinc-300 bg-white px-4 text-base outline-none transition focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 dark:border-zinc-700 dark:bg-zinc-950 dark:focus:border-emerald-400" />
          <button type="submit" [disabled]="forgotForm.invalid" class="mt-6 min-h-12 w-full rounded-full bg-emerald-500 px-5 text-sm font-semibold text-white transition hover:bg-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/20 disabled:cursor-not-allowed disabled:opacity-50 dark:text-zinc-950">Send reset instructions</button>
        </form>
      }

      <a routerLink="/login" class="mt-6 block min-h-11 rounded-2xl px-4 py-3 text-center text-sm font-semibold text-emerald-700 hover:bg-zinc-50 dark:text-emerald-400 dark:hover:bg-zinc-800">Back to sign in</a>
    </section>
  </div>
</main>
