<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <form
    [formGroup]="loginForm"
    (ngSubmit)="login()"
    class="bg-white p-8 rounded-lg shadow-md w-96 space-y-4">

    <h2 class="text-2xl font-bold text-center">
      Personal Finance Dashboard
    </h2>

    <div>
      <label>Email</label>

      <input
        type="email"
        formControlName="email"
        class="w-full border rounded-md p-2">
    </div>

    <div>
      <label>Password</label>

      <input
        type="password"
        formControlName="password"
        class="w-full border rounded-md p-2">
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 hover:cursor-pointer disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="loginForm.invalid">
      
      Login

    </button>

    <p class="text-center text-gray-600">
      Don't have an account?

      <a
        routerLink="/signup"
        class="text-blue-600 hover:underline">

        Signup

      </a>
    </p>

  </form>
</div>
