<nav class="space-y-2">

  @for (item of navigationItems; track item.route) {

    <button
      class="flex w-full items-center gap-4
             rounded-2xl
             px-4 py-3
             transition
             hover:bg-zinc-100
             dark:hover:bg-zinc-800">

      <!-- Placeholder Icon -->
      <div
        class="h-6 w-6 rounded bg-zinc-300 dark:bg-zinc-700">
      </div>

      <span class="hidden lg:block">
        {{ item.label }}
      </span>

    </button>

  }

</nav>
