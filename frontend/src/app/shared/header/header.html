<header class="flex min-h-14 items-center justify-between gap-3 rounded-3xl border border-zinc-200 bg-white px-3.5 py-2.5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:px-4 lg:min-h-16 lg:px-5">
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-zinc-100 text-zinc-700 transition-colors hover:bg-zinc-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700 dark:focus-visible:ring-offset-zinc-900"
      aria-label="Open navigation menu">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16" />
        <path d="M4 12h16" />
        <path d="M4 17h16" />
      </svg>
    </button>

    <div class="min-w-0">
      <p class="text-xs font-medium uppercase tracking-[0.18em] text-zinc-400 dark:text-zinc-500">XPENSE</p>
      <h1 class="truncate text-sm font-semibold leading-5 text-zinc-950 dark:text-white sm:text-base">
        {{ greeting }}
      </h1>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <button
      type="button"
      class="relative flex h-11 w-11 items-center justify-center rounded-2xl bg-zinc-100 text-zinc-700 transition-colors hover:bg-zinc-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700 dark:focus-visible:ring-offset-zinc-900"
      aria-label="Notifications">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5a4 4 0 0 1 4 4v2.2c0 1.2.4 2.4 1.1 3.4l.8 1.1H6.1l.8-1.1A5.2 5.2 0 0 0 8 11.2V9a4 4 0 0 1 4-4Z" />
        <path d="M10 18a2 2 0 0 0 4 0" />
      </svg>
      <span class="absolute right-2.5 top-2.5 h-1.5 w-1.5 rounded-full bg-emerald-500" aria-hidden="true"></span>
    </button>
  </div>
</header>
