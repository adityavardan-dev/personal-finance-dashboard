<header class="flex items-center justify-between rounded-[1.25rem] border border-zinc-200/80 bg-white/80 px-3 py-2.5 shadow-sm shadow-zinc-200/60 backdrop-blur-sm dark:border-zinc-800 dark:bg-zinc-900/80 dark:shadow-none sm:px-4">
  <div class="flex min-w-0 items-center gap-2.5">
    <button class="flex h-9 w-9 items-center justify-center rounded-full bg-zinc-100 text-zinc-700 transition hover:bg-zinc-200 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700" aria-label="Open menu">
      <svg viewBox="0 0 24 24" class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16" />
        <path d="M4 12h16" />
        <path d="M4 17h16" />
      </svg>
    </button>

    <div class="flex min-w-0 flex-col justify-center">
      <p class="text-[0.65rem] font-medium uppercase tracking-[0.24em] text-zinc-400 dark:text-zinc-500">Dashboard</p>
      <h1 class="truncate text-[0.95rem] font-semibold leading-4 text-zinc-900 dark:text-white">
        {{ greeting }}
      </h1>
    </div>
  </div>

  <button class="flex h-9 w-9 items-center justify-center rounded-full bg-zinc-100 text-zinc-700 transition hover:bg-zinc-200 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700" aria-label="Notifications">
    <svg viewBox="0 0 24 24" class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5a4 4 0 0 1 4 4v2.2c0 1.2.4 2.4 1.1 3.4l.8 1.1H6.1l.8-1.1A5.2 5.2 0 0 0 8 11.2V9a4 4 0 0 1 4-4Z" />
      <path d="M10 18a2 2 0 0 0 4 0" />
    </svg>
  </button>
</header>
