<div
  class="app-layout-root min-h-screen overflow-x-clip bg-zinc-50 text-zinc-950 dark:bg-zinc-950 dark:text-white"
  [class.glass-layout]="variant() === 'glass'"
>
  <div class="mx-auto min-h-screen max-w-7xl px-4 py-4 sm:px-5 sm:py-5 lg:px-6 lg:py-6">
    @if (!hideHeader()) { <app-header /> }

    <div
      class="mt-5 grid gap-5 md:grid-cols-[5.5rem_minmax(0,1fr)] lg:grid-cols-[18rem_minmax(0,1fr)] lg:gap-6"
    >
      <aside class="hidden md:block">
        <app-sidebar />
      </aside>

      <main class="min-w-0 md:pb-8 lg:pb-2" [class.pb-24]="!hideBottomNav()" [class.pb-8]="hideBottomNav()" tabindex="-1">
        <div class="space-y-6">
          <ng-content />
        </div>
      </main>
    </div>
  </div>

  @if (!hideBottomNav()) {
    <div class="md:hidden">
      <app-bottom-nav />
    </div>
  }
</div>
